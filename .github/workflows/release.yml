name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/octopus-autojoin-linux-amd64 \
            .

      - name: Generate checksum
        working-directory: dist
        run: |
          sha256sum octopus-autojoin-linux-amd64 \
            > octopus-autojoin-linux-amd64.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/octopus-autojoin-linux-amd64 \
            dist/octopus-autojoin-linux-amd64.sha256 \
            --verify-tag \
            --generate-notes